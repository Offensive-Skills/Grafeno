<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title data-i18n="title.mainMenu">Grafeno - Menú Principal</title>
    <link rel="stylesheet" href="../../assets/css/mainMenu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <!-- Incluye Chart.js para poder usar la variable Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="dark-theme">
    <canvas id="bgCanvas"></canvas>

    <label class="lang-pill">
      <input type="checkbox" class="lang-switch" />
      <span class="lang-thumb"></span>
      <span class="lang-label" data-lang="es"><span class="lang-flag">🇪🇸</span> ES</span>
      <span class="lang-label" data-lang="en"><span class="lang-flag">🇬🇧</span> EN</span>
    </label>

    <div class="menu-overlay">
      <!-- Lado izquierdo: Botones (35%) -->
      <div class="menu-left">
        <button id="btn-retos" class="menu-button" data-i18n="nav.retos">Retos</button>
        <button id="btn-temporada" class="menu-button" data-i18n="nav.temporada">Temporada</button>
        <button id="btn-cursos" class="menu-button" data-i18n="nav.cursos">Cursos</button>
        <button id="btn-ranking" class="menu-button" data-i18n="nav.ranking">Ranking</button>
        <button id="btn-config" class="menu-button" data-i18n="nav.config">Configuracion</button>
        
      </div>
      <!-- Lado derecho: Estadísticas (65%) -->
      <div class="menu-right">
        <div class="stats-container">
          <canvas id="statsChart"></canvas>
        </div>
      </div>
    </div>
    
    <script src="../../controllers/apiEndpoints.js"></script>
    <script src="../background/background.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="mainMenu.js"></script>
  </body>
</html>
