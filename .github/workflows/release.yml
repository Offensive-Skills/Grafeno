name: Build releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install npm deps
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000

      - name: Build linux ${{ matrix.arch }}
        run: npx electron-builder --linux deb AppImage rpm --${{ matrix.arch }} -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
            dist/latest*.yml
            dist/*.blockmap

  build-mac:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build macOS arm64
        run: npx electron-builder --mac dmg --arm64 -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify update metadata
        run: node scripts/verifyUpdateMetadata.js artifacts

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Grafeno $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt
          for file in latest-linux.yml latest-linux-arm64.yml latest-mac.yml; do
            grep -qx "$file" /tmp/assets.txt || { echo "Missing $file in release"; exit 1; }
          done
          cat /tmp/assets.txt
