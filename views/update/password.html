<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="update.installTitle">Instalar actualización</title>
    <link rel="stylesheet" href="../../assets/css/updatePassword.css" />
  </head>
  <body class="dark-theme">
    <main class="update-install">
      <h1 data-i18n="update.installTitle">Instalar actualización</h1>
      <p id="update-version" class="update-install-version"></p>
      <p class="update-install-hint" data-i18n="update.installHint">
        Introduce tu contraseña de administrador (sudo) para instalar la actualización.
      </p>
      <form id="installForm">
        <label for="password" data-i18n="update.passwordLabel">Contraseña sudo</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          autofocus
          data-i18n-placeholder="update.passwordPlaceholder"
          placeholder="Contraseña"
          required
        />
        <div class="update-install-actions">
          <button type="button" id="cancelButton" data-i18n="update.installCancel">Cancelar</button>
          <button type="submit" id="installButton" data-i18n="update.installButton">Instalar</button>
        </div>
      </form>
      <p id="installStatus" class="update-install-status"></p>
      <pre id="installOutput" class="update-install-output"></pre>
    </main>
    <script src="../shared/i18n.js"></script>
    <script src="password.js"></script>
  </body>
</html>
