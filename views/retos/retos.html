<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="title.retos">Retos - Grafeno</title>
    <link rel="stylesheet" href="../../assets/css/retos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="dark-theme">
    <canvas id="bgCanvas"></canvas>
    <div class="retos-overlay">
      <div class="top-bar">
        <select id="select-dificultad">
          <option value="Facil" data-i18n="difficulty.facil">Fácil</option>
          <option value="Medio" data-i18n="difficulty.medio">Medio</option>
          <option value="Dificil" data-i18n="difficulty.dificil">Difícil</option>
          <option value="Insano" data-i18n="difficulty.insano">Insano</option>
        </select>
        <select id="select-tematica">
          <option value="Web" data-i18n="topic.web">Web</option>
          <option value="Criptografia" data-i18n="topic.cripto">Criptografía</option>
          <option value="Forense" data-i18n="topic.forense">Forense</option>
          <option value="escalada_de_privilegios" data-i18n="topic.privesc">Escalada de Privilegios</option>
          <option value="Reversing" data-i18n="topic.reversing">Reversing</option>
          <option value="Esteganografia" data-i18n="topic.estego">Esteganografía</option>
          <option value="Miscelanea" data-i18n="topic.misc">Miscelánea</option>
          <option value="PWN" data-i18n="topic.pwn">PWN</option>
        </select>
        <select id="select-estado">
          <option value="Todos" data-i18n="status.todos">Todos</option>
          <option value="Completado" data-i18n="status.completado">Completado</option>
          <option value="Pendientes" data-i18n="status.pendientes">Pendientes</option>
        </select>
        <button id="btn-buscar" class="bar-button" data-i18n="retos.btnSearch">Buscar</button>
        <button id="btn-atras" class="bar-button-atras" data-i18n="retos.btnBack">Atrás</button>
      </div>
      <div class="main-content">
        <div class="retos-list" id="retos-list"></div>
        <div class="reto-detail" id="reto-detail">
          <div id="download-status" class="download-status"></div>
        </div>
      </div>
    </div>
    <script src="../../controllers/apiEndpoints.js"></script>
    <script src="../shared/clipboard.js"></script>
    <script src="../shared/ContextManager.js"></script>
    <script src="../shared/RetosApi.js"></script>
    <script src="../shared/RetosList.js"></script>
    <script src="../shared/DockerManager.js"></script>
    <script src="../shared/RetosDetail.js"></script>
    <script src="../background/background.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="retos.js"></script>
  </body>
</html>
